name = "nextstop-english"
compatibility_date = "2026-11-01"

# Static site served by Workers static assets. Unknown paths (/u/…, /taller)
# fall back to index.html so client-side routing works.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# `wrangler deploy` builds the site first, so the Cloudflare project works
# even when no separate build command is configured in the dashboard.
[build]
command = "npm run build"
